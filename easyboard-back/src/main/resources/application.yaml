spring:
  redis:
    host: ${REDIS_DB_USER:localhost}
    port: 6379
    database: 0
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/users_db} # Значение по умолчанию
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

token:
  expiration-time:
    access: 9000000 #15 минут
    refresh: 604800000 #7 дней
